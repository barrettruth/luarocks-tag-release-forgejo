name: quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  format:
    name: Format
    runs-on: nix
    steps:
      - uses: actions/checkout@v4
      - name: Format
        run: nix develop --accept-flake-config .#ci --command just format
  lint:
    name: Lint
    runs-on: nix
    steps:
      - uses: actions/checkout@v4
      - name: Lint
        run: nix develop --accept-flake-config .#ci --command just lint
  test:
    name: Test
    runs-on: nix
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: nix develop --accept-flake-config .#ci --command just test
  build-aarch64:
    name: Build aarch64
    runs-on: nix
    steps:
      - uses: actions/checkout@v4
      - name: Build aarch64
        run: nix develop --accept-flake-config .#ci --command just build-aarch64
